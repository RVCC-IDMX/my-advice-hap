<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Advice</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <header>
      <h1>My Advice</h1>
      <p class="subtitle">Get advice based on how you are feeling right now.</p>
    </header>

    <main>
      <section class="form-section">
        <form id="advice-form">
          <label for="mood-select">How are you feeling?</label>
          <select id="mood-select" name="mood">
            <option value="stressed">Stressed</option>
            <option value="unmotivated">Unmotivated</option>
            <option value="overwhelmed">Overwhelmed</option>
            <option value="confident">Confident</option>
          </select>
          <button type="submit">Get advice</button>
        </form>
      </section>

      <section class="results-section" aria-live="polite">
        <div id="advice-output"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 My Advice</p>
    </footer>

    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
